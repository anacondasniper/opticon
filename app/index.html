<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Opticon - webcam test</title>
	<link rel="stylesheet" href="styles/style.css" />
	<link rel="apple-touch-icon" href="/icons/opticon-ico180.png" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-title" content="Opticon" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
</head>
<body>
	<div id="login" style="display:none;">
		<img id="iconLogo" src="icons/opticon-ico180-transparent.png" alt="Opticon" />
		<h2>opticon</h2>
		<form id="loginForm">
			<input id="username" placeholder="Username" autocomplete="username" />
			<input id="password" type="password" placeholder="Password" autocomplete="current-password" />
			<button id="loginBtn">Login</button>
			<div id="loginError"></div>
		</form>
	</div>
	<div id="list" style ="display:block;">
		<header class="list-header">
			<h1>Doorbells</h1>
		</header>

		<div class="doorbell-cards">
			<button class="doorbell-card">
				<div class="doorbell-icon">🔔</div>
				<div class="doorbell-info">
					<div class="doorbell-name">Front Door</div>
					<div class="doorbell-status">Online</div>
				</div>
				<div class="doorbell-chevron">›</div>
			</button>
			<button class="doorbell-card">
				<div class="doorbell-icon">🔔</div>
				<div class="doorbell-info">
					<div class="doorbell-name">Back Door</div>
					<div class="doorbell-status">Online</div>
				</div>
				<div class="doorbell-chevron">›</div>
			</button>
		</div>
	</div>
	<div id="app" style="display:none;">
		<h1>Opticon Webcam Test</h1>
		<div id="status">starting...</div>
		<div class="videos">
			<div><div class="label">you (local)</div><video id="local" autoplay playsinline muted></video></div>
			<div><div class="label">other (remote)</div><video id="remote" autoplay playsinline muted></video></div>
		</div>
		<button id="enablePush">Enable Notifications</button>
	</div>

	<script src="scripts/webrtc.js"></script>
	<script src="scripts/auth.js"></script>
	<script src="scripts/push.js"></script>
</body>
</html>
